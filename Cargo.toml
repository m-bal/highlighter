[package]
name = "highlighter"
version = "0.3.0"
edition = "2021"
authors = ["highlighter contributors"]
description = "A Neovim plugin for visually highlighting text with colors"
repository = "https://github.com/m-bal/highlighter"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
mlua = { version = "0.8.8", features = ["luajit52"] }
nvim-oxi = { version = "0.2.2", features = ["neovim-0-8", "test", "mlua"] }
